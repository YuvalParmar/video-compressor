[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-live-codec"
version = "0.1.0"
description = "CPU-first semantic video compression demo"
requires-python = ">=3.10"
dependencies = [
  "gradio>=4.0",
  "numpy>=1.24",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
