[package]
name = "focusstream"
version = "0.3.0"
description = "Private, focus-aware video compression"
authors = ["FocusStream"]
edition = "2021"

[lib]
name = "focusstream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
